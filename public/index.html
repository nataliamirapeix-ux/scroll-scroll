<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>scroll-scroll</title>
  <meta name="description" content="Cajón de sastre de Natalia y Daniel. Frases, gifs, vídeos, pensamientos.">
  <meta name="theme-color" content="#e9e9e3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M8 7l8 7 8-7M8 17l8 7 8-7' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='square'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <h1 class="corner tl tiny"><a href="/">scroll-scroll</a></h1>
  <p class="corner tr tiny" id="count" aria-live="polite"></p>
  <p class="corner ml tiny" data-tagline></p>
  <p class="corner mr tiny" data-tagline></p>

  <main id="feed" class="feed" aria-label="Todo lo subido"></main>

  <p class="sentinel" id="sentinel" aria-hidden="true"></p>

  <footer class="colophon">
    <p><span class="mark">scroll-scroll</span> son <a class="mark" href="https://www.linkedin.com/in/nataliamirapeix" target="_blank" rel="noopener">Natalia Mirapeix</a> y <a class="mark" href="https://www.linkedin.com/in/daniel-yustos-consultor-estrategico/" target="_blank" rel="noopener">Daniel Yustos</a></p>
  </footer>

  <div class="dropveil" id="dropveil" aria-hidden="true"><span>suelta aquí</span></div>

  <form class="composer" id="composer" autocomplete="off">
    <div class="who tiny" role="radiogroup" aria-label="Quién sube">
      <label class="who-natalia"><input type="radio" name="who" value="natalia"><span>natalia</span></label>
      <label class="who-daniel"><input type="radio" name="who" value="daniel"><span>daniel</span></label>
      <label class="who-juntos"><input type="radio" name="who" value="natalia&amp;daniel"><span>natalia&amp;daniel</span></label>
    </div>
    <div class="row">
      <textarea id="text" rows="1" placeholder="escribe o pega algo" aria-label="Escribe o pega algo"></textarea>
      <label class="clip" title="Adjuntar archivo">
        <input type="file" id="file" accept="image/*,video/mp4,video/webm,video/quicktime,audio/*" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 12.5l7-7a3.2 3.2 0 014.5 4.5l-8.3 8.3a5.3 5.3 0 01-7.5-7.5L11.5 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="sr">Adjuntar archivo</span>
      </label>
      <button type="submit" id="send" class="send" disabled>subir</button>
    </div>
    <div class="pending tiny" id="pending" hidden></div>
    <p class="status tiny" id="status" role="status"></p>
  </form>

  <dialog id="passdialog" class="passdialog">
    <form method="dialog" id="passform">
      <label for="pass" class="tiny">Contraseña para subir</label>
      <input type="password" id="pass" autocomplete="current-password">
      <div class="dialog-actions">
        <button type="button" id="passcancel">cancelar</button>
        <button type="submit">entrar</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js" defer></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
